services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imperio_peru}
      POSTGRES_USER: ${POSTGRES_USER:-imperio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imperio-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imperio} -d ${POSTGRES_DB:-imperio_peru}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-imperio_peru}
      DATABASE_USERNAME: ${POSTGRES_USER:-imperio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-imperio-local-only}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@imperioperu.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-first-run}
      APP_DEMO_DATA: ${APP_DEMO_DATA:-false}
      IMPORT_APPLY_ENABLED: ${IMPORT_APPLY_ENABLED:-false}
      MEDIA_ROOT: /app/storage
    ports:
      - "8080:8080"
    volumes:
      - media-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  media-storage:
